[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "atlas"
version = "0.2.0"
description = "Headless real-time Atlas collaboration backend"
authors = [{ name = "KAMDEM Ivann", email = "kapoivha@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.118.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "typer>=0.19.0",
    "uvicorn[standard]>=0.37.0",
    "websockets>=15.0",
]

[project.scripts]
atlas = "atlas.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.405",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.uv.build-backend]
module-name = "atlas"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
